[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pynonthermal"
authors = [{ name = "Luke J. Shingles", email = "luke.shingles@gmail.com" }]
description = "A non-thermal electron deposition (Spencer-Fano equation) solver."
keywords = [
    "Spencer-Fano",
    "non-thermal electrons",
    "supernovae",
    "ionisation",
    "excitation",
    "plasma",
    "radiative transfer",
    "astrophysics",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = ["version"]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = 'text/markdown' }
dependencies = [
    "artistools>=2026.4.20",
    "matplotlib>=3.10.7",
    "numpy>=2.4.4",
    "polars>=1.40.1",
]

[dependency-groups]
dev = [
    "prek>=0.2.25",
    "pyrefly>=1.5.0",
    "pytest>=9.0.2",
    "pytest-codspeed>=4.1.1",
    "pytest-cov>=2.10.1",
    "pytest-xdist[psutil]>=3.6.1",
    "ruff>=0.16.7",
    "ty>=0.0.107",
]

[project.urls]
Repository = "https://github.com/artis-mcrt/pynonthermal"
Documentation = "https://github.com/artis-mcrt/pynonthermal#readme"
Issues = "https://github.com/artis-mcrt/pynonthermal/issues"
Changelog = "https://github.com/artis-mcrt/pynonthermal/releases"

[tool.pyrefly]
project-includes = ["pynonthermal"]
project-excludes = [
    "**/build*",
    "**/dist*",
    "**/tests*",
    "**/data*",
    "**/.venv*",
    "**/venv*",
    "**/_version.py",
]

[tool.pyrefly.errors]
# The annotations say int, but a caller can pass a numpy integer. The int() calls make a Python
# integer on purpose, so this rule gives only false positives here.
unnecessary-type-conversion = false
# these kinds are off by default. The checked code has no finding of them, so a new finding is a
# regression.
abstract-method-with-implementation = "error"
empty-body = "error"
implicit-abstract-class = "error"
implicit-any = "error"
implicit-reexport = "error"
implicitly-defined-attribute = "error"
incompatible-comparison = "error"
instance-var-assign = "error"
invalid-abstract-method = "error"
invalid-cast = "error"
invalid-format-spec = "error"
method-assign = "error"
missing-override-decorator = "error"
missing-source = "error"
missing-super-call = "error"
no-any-return = "error"
non-exhaustive-match-open-type = "error"
not-required-key-access = "error"
open-unpacking = "error"
possibly-uninitialized-attribute = "error"
potential-bad-keyword-argument = "error"
protected-access = "error"
string-as-iterable = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unknown-attribute-access = "error"
unknown-attribute-type = "error"
unknown-base-class = "error"
unknown-from-error = "error"
unknown-return-type = "error"
unsupported-dynamic-base = "error"
untyped-class-decorator = "error"
untyped-function-decorator = "error"
untyped-namedtuple = "error"
unused-ignore = "error"
unused-type-ignore = "error"

[tool.ty.rules]
# these rules are off by default. The checked code has no finding of them, so a new finding is a
# regression.
blanket-ignore-comment = "error"
disjoint-cast = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
invalid-legacy-positional-parameter = "error"
mismatched-sentinel-name = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-condition-strict = "error"
truthiness-test-of-none-union = "error"
unsound-assignment = "error"
unsound-return = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"

[tool.pytest.ini_options]
addopts = " --durations=0 -n auto"
filterwarnings = [
    "error",
    # A free-threaded Python build turns on the GIL when it loads an extension module that does not
    # declare support for free threading, for example fontTools through matplotlib. The warning comes
    # from a dependency, not from pynonthermal.
    "ignore:The global interpreter lock:RuntimeWarning",
]

[tool.ruff]
line-length = 120
fix = true
extend-exclude = ["_version.py"]
required-version = ">=0.16.0"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # any-type
    "C901",    # complex-structure
    "COM812",  # missing-trailing-comma
    "CPY001",  # missing-copyright-notice
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "ERA001",  # commented-out-code
    "FBT",
    "N802",    # Function name should be lowercase
    "N803",    # Argument name should be lowercase
    "N806",    # non-lowercase-variable-in-function
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0917",
    "PLR2004", # magic-value-comparison
    "S101",    # Use of assert detected
    "T201",    # print found
]
fixable = ["ALL"]
unfixable = [
    "COM812", # missing-trailing-comma
    "ERA001", # commented-out-code (will just delete it!)
    "F401",   # unused-import
    "F841",   # unused-variable
    "SIM222", # expr-or-true
    "SIM223", # expr-and-false
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"artistools" = "at"
"matplotlib" = "mpl"
"matplotlib.pyplot" = "plt"
"matplotlib.typing" = "mplt"
"numpy.typing" = "npt"
"typing" = "t"

[tool.ruff.lint.per-file-ignores]
"pynonthermal/tests/*" = [
    "D102",   # undocumented-public-method
    "D103",   # undocumented-public-function
    "SLF001", # tests may use private members to compare against production inputs
]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.setuptools]
packages = ["pynonthermal"]
include-package-data = false

[tool.setuptools.package-data]
pynonthermal = ["py.typed", "data/**/*.txt", "data/**/*.zst"]

[tool.setuptools_scm]
version_file = "pynonthermal/_version.py"
local_scheme = "no-local-version"

[tool.vulture]
exclude = [".*", "build/", ".eggs/", ".venv", "venv"]
paths = ["pynonthermal"]
sort_by_size = true
